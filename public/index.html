<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Print - Invoice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #222; }
  .topbar { background: #1e293b; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 18px; }
  .tabs { display: flex; gap: 8px; }
  .tabs button {
    background: transparent; border: none; color: #cbd5e1; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .tabs button.active { background: #334155; color: #fff; }
  .tabs button:hover:not(.active) { background: #33415580; color: #fff; }
  .container { max-width: 1000px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  h2 { margin-bottom: 16px; font-size: 20px; }
  h3 { margin: 20px 0 10px; font-size: 15px; color: #334155; }
  .form-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .form-row label { flex: 1; display: flex; flex-direction: column; font-size: 13px; color: #475569; gap: 6px; min-width: 200px; }
  .form-row input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; vertical-align: middle; }
  th { background: #f1f5f9; font-weight: 600; }
  td input, td select { width: 100%; border: 1px solid transparent; padding: 6px; font-size: 13px; border-radius: 4px; background: #fff; }
  td input:focus, td select:focus { outline: none; border-color: #6366f1; }
  td input[readonly] { background: #f8fafc; color: #475569; }
  td.subtotal { font-weight: 600; text-align: right; background: #f8fafc; }
  .btn-remove { background: #fee2e2; border: none; color: #b91c1c; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn-primary, .btn-secondary {
    border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-secondary { background: #e2e8f0; color: #334155; margin-top: 10px; }
  .btn-secondary:hover { background: #cbd5e1; }
  .totals { margin-top: 20px; padding: 16px; background: #f8fafc; border-radius: 8px; }
  .total-row { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 8px; }
  .terbilang { font-size: 13px; color: #64748b; font-style: italic; }
  .actions { margin-top: 16px; text-align: right; }
  .message { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; }
  .message.success { display: block; background: #dcfce7; color: #166534; }
  .message.error { display: block; background: #fee2e2; color: #991b1b; }
  .btn-download, .btn-delete {
    padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600;
    text-decoration: none; display: inline-block;
  }
  .btn-download { background: #dbeafe; color: #1e40af; }
  .btn-download:hover { background: #bfdbfe; }
  .btn-delete { background: #fee2e2; color: #b91c1c; }
  .btn-delete:hover { background: #fecaca; }
  .actions-cell { display: flex; gap: 6px; }
  .empty { color: #94a3b8; font-style: italic; text-align: center; padding: 24px; }
  .hidden { display: none; }

  /* Kartu Ringkasan Pemasukan di Tab Riwayat */
  .income-summary {
    display: flex; justify-content: space-between; align-items: center;
    background: #eef2ff; border: 1px solid #c7d2fe; color: #1e1b4b;
    padding: 16px 20px; border-radius: 8px; margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
  }
  .income-summary .label { font-size: 14px; font-weight: 600; color: #4338ca; }
  .income-summary .sub-label { font-size: 12px; color: #64748b; margin-top: 2px; }
  .income-summary .amount { font-size: 22px; font-weight: 700; color: #1e1b4b; }
</style>
</head>
<body>
  <header class="topbar">
    <h1>Mission Print</h1>
    <div class="tabs">
      <button id="tabForm" class="active">Buat Invoice</button>
      <button id="tabHistory">Riwayat</button>
    </div>
  </header>

  <!-- ===== TAB FORM ===== -->
  <main id="viewForm" class="container">
    <h2>Buat Invoice Baru</h2>
    <div class="form-row">
      <label>Nomor Invoice
        <input type="text" id="invoiceNumber" placeholder="Cetak Ke-001">
      </label>
      <label>Tanggal
        <input type="date" id="invoiceDate">
      </label>
    </div>

    <h3>Item (maks 10 baris)</h3>
    <table>
      <thead>
        <tr>
          <th style="width:25%">Deskripsi</th>
          <th style="width:30%">Jasa</th>
          <th style="width:15%">Harga</th>
          <th style="width:10%">Qty</th>
          <th style="width:15%">Subtotal</th>
          <th style="width:5%"></th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <button type="button" id="addRowBtn" class="btn-secondary">+ Tambah Baris</button>

    <div class="totals">
      <div class="total-row">
        <span>Grand Total</span>
        <strong id="grandTotal">Rp 0</strong>
      </div>
      <div class="terbilang" id="terbilang"></div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">Simpan &amp; Download PDF</button>
    </div>
    <div id="message" class="message"></div>
  </main>

  <!-- ===== TAB RIWAYAT ===== -->
  <main id="viewHistory" class="container hidden">
    <h2>Riwayat Invoice</h2>

    <div class="income-summary">
      <div>
        <div class="label">Grand Total Pemasukan</div>
        <div class="sub-label" id="totalTxCount">0 transaksi tersimpan</div>
      </div>
      <div class="amount" id="historyGrandTotal">Rp 0</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nomor</th>
          <th>Tanggal</th>
          <th>Total</th>
          <th style="width:200px">Aksi</th>
        </tr>
      </thead>
      <tbody id="historyBody"></tbody>
    </table>
    <p id="emptyMsg" class="empty hidden">Belum ada invoice.</p>
  </main>

<script>
// ========== UTIL ==========
const fmt = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtNum = (n) => Number(n || 0).toLocaleString('id-ID');

function formatTanggalIndo(dateStr) {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    return `${parts[2]}-${parts[1]}-${parts[0]}`;
  }
  return dateStr;
}

function terbilang(n) {
  n = Math.floor(Math.abs(n));
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  if (n < 12) return s[n];
  if (n < 20) return s[n - 10] + ' belas';
  if (n < 100) return s[Math.floor(n / 10)] + ' puluh' + (n % 10 ? ' ' + s[n % 10] : '');
  if (n < 200) return 'seratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 1000) return s[Math.floor(n / 100)] + ' ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'seribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1000000) return terbilang(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + ' juta' + (n % 1000000 ? ' ' + terbilang(n % 1000000) : '');
  return terbilang(Math.floor(n / 1000000000)) + ' miliar' + (n % 1000000000 ? ' ' + terbilang(n % 1000000000) : '');
}
function terbilangRupiah(n) {
  if (n === 0) return 'nol rupiah';
  const t = terbilang(n).trim().replace(/\s+/g, ' ');
  return t.charAt(0).toUpperCase() + t.slice(1) + ' rupiah';
}

// ========== TAB SWITCH ==========
const tabForm = document.getElementById('tabForm');
const tabHistory = document.getElementById('tabHistory');
const viewForm = document.getElementById('viewForm');
const viewHistory = document.getElementById('viewHistory');

tabForm.onclick = () => {
  tabForm.classList.add('active'); tabHistory.classList.remove('active');
  viewForm.classList.remove('hidden'); viewHistory.classList.add('hidden');
};
tabHistory.onclick = () => {
  tabHistory.classList.add('active'); tabForm.classList.remove('active');
  viewHistory.classList.remove('hidden'); viewForm.classList.add('hidden');
  loadHistory();
};

// ========== FORM: SERVICES ==========
let services = [];
const tbody = document.getElementById('itemsBody');

async function loadServices() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  services = cfg.services;
  addRow();
}

function fillSelect(select) {
  select.innerHTML = '<option value="">-- pilih jasa --</option>' +
    services.map(s => `<option value="${s.code}" data-price="${s.price}">${s.label}</option>`).join('');
}

function addRow() {
  if (tbody.children.length >= 10) { alert('Maksimal 10 baris'); return; }
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="desc-input" placeholder="Nama file yang diprint"></td>
    <td><select class="service-select"></select></td>
    <td><input type="text" class="price-input" readonly></td>
    <td><input type="number" class="qty-input" min="0" value="1"></td>
    <td class="subtotal">Rp 0</td>
    <td><button type="button" class="btn-remove">×</button></td>
  `;
  tbody.appendChild(tr);
  const select = tr.querySelector('.service-select');
  fillSelect(select);

  select.addEventListener('change', () => {
    const opt = select.selectedOptions[0];
    const price = opt && opt.dataset.price ? parseInt(opt.dataset.price) : 0;
    tr.querySelector('.price-input').value = price ? fmtNum(price) : '';
    tr.dataset.price = price;
    recalcRow(tr); recalcTotal();
  });
  tr.querySelector('.qty-input').addEventListener('input', () => { recalcRow(tr); recalcTotal(); });
  tr.querySelector('.btn-remove').addEventListener('click', () => { tr.remove(); recalcTotal(); });
}

function recalcRow(tr) {
  const price = parseInt(tr.dataset.price) || 0;
  const qty = parseInt(tr.querySelector('.qty-input').value) || 0;
  const sub = price * qty;
  tr.querySelector('.subtotal').textContent = fmt(sub);
  tr.dataset.subtotal = sub;
}

function recalcTotal() {
  let total = 0;
  tbody.querySelectorAll('tr').forEach(tr => total += parseInt(tr.dataset.subtotal) || 0);
  document.getElementById('grandTotal').textContent = fmt(total);
  document.getElementById('terbilang').textContent = total > 0 ? terbilangRupiah(total) : '';
}

document.getElementById('addRowBtn').onclick = addRow;

// ========== SIMPAN ==========
document.getElementById('saveBtn').onclick = async () => {
  const msg = document.getElementById('message');
  msg.className = 'message'; msg.textContent = '';

  const number = document.getElementById('invoiceNumber').value.trim();
  const date = document.getElementById('invoiceDate').value;
  if (!number) return showMsg('Nomor invoice wajib diisi', 'error');
  if (!date) return showMsg('Tanggal wajib diisi', 'error');

  const items = [];
  for (const tr of tbody.querySelectorAll('tr')) {
    const desc = tr.querySelector('.desc-input').value.trim();
    const code = tr.querySelector('.service-select').value;
    const qty = parseInt(tr.querySelector('.qty-input').value) || 0;
    if (!code && !desc) continue;
    if (!code) return showMsg('Pilih jasa untuk semua baris yang terisi', 'error');
    if (qty <= 0) return showMsg('Qty harus lebih dari 0', 'error');
    items.push({ description: desc, service_code: code, qty });
  }
  if (items.length === 0) return showMsg('Minimal 1 item', 'error');

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';

  try {
    const res = await fetch('/api/invoices', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number, date, items })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal simpan');

    // Download PDF
    window.location.href = `/api/invoices/${data.id}/pdf`;

    showMsg('Invoice tersimpan. PDF sedang diunduh.', 'success');
    // Reset form
    setTimeout(() => {
      tbody.innerHTML = '';
      addRow();
      document.getElementById('invoiceNumber').value = '';
      recalcTotal();
    }, 800);
  } catch (e) {
    showMsg(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan & Download PDF';
  }
};

function showMsg(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message ' + type;
}

// ========== RIWAYAT ==========
async function loadHistory() {
  const res = await fetch('/api/invoices');
  const rows = await res.json();
  const body = document.getElementById('historyBody');
  const empty = document.getElementById('emptyMsg');
  const historyGrandTotal = document.getElementById('historyGrandTotal');
  const totalTxCount = document.getElementById('totalTxCount');

  // Urutkan riwayat berdasarkan nomor (Cetak Ke-001, Cetak Ke-002, ..., Cetak Ke-011, dst.)
  rows.sort((a, b) => String(a.number).localeCompare(String(b.number), 'id', { numeric: true }));

  body.innerHTML = '';

  // Hitung Grand Total Pemasukan dari seluruh riwayat
  const totalPemasukan = rows.reduce((sum, r) => sum + (Number(r.total) || 0), 0);
  historyGrandTotal.textContent = fmt(totalPemasukan);
  totalTxCount.textContent = `${rows.length} transaksi tersimpan`;

  if (rows.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.number}</td>
      <td>${formatTanggalIndo(r.date)}</td>
      <td>${fmt(r.total)}</td>
      <td class="actions-cell">
        <a class="btn-download" href="/api/invoices/${r.id}/pdf">Download PDF</a>
        <button class="btn-delete" data-id="${r.id}">Hapus</button>
      </td>
    `;
    tr.querySelector('.btn-delete').onclick = async () => {
      if (!confirm('Hapus invoice ' + r.number + '?')) return;
      await fetch('/api/invoices/' + r.id, { method: 'DELETE' });
      loadHistory();
    };
    body.appendChild(tr);
  }
}

// ========== INIT ==========
document.getElementById('invoiceDate').valueAsDate = new Date();
loadServices();
</script>
</body>
</html>
